<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Terminal de Yonathan Sánchez, Full-Stack Developer Jr">
  <title>Yonathan Sánchez · Full-Stack Developer Jr</title>

  <defs>
    <linearGradient id="gold-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C872"/>
      <stop offset="0.55" stop-color="#9C7A2E"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Una máscara de recorte por línea: su ancho crece para simular el tipeo -->
    <clipPath id="c1"><rect class="t" x="36" y="68" height="30" style="--w:260px;animation-duration:.8s;animation-delay:.4s;animation-timing-function:steps(21,end)"/></clipPath>
    <clipPath id="c2"><rect class="t" x="36" y="108" height="30" style="--w:340px;animation-duration:1s;animation-delay:1.6s;animation-timing-function:steps(27,end)"/></clipPath>
    <clipPath id="c3"><rect class="t" x="36" y="140" height="30" style="--w:410px;animation-duration:1.1s;animation-delay:2.8s;animation-timing-function:steps(33,end)"/></clipPath>
    <clipPath id="c4"><rect class="t" x="36" y="172" height="30" style="--w:500px;animation-duration:1.3s;animation-delay:4.1s;animation-timing-function:steps(41,end)"/></clipPath>
    <clipPath id="c5"><rect class="t" x="36" y="204" height="30" style="--w:440px;animation-duration:1.2s;animation-delay:5.6s;animation-timing-function:steps(36,end)"/></clipPath>
    <clipPath id="c6"><rect class="t" x="36" y="244" height="30" style="--w:190px;animation-duration:.5s;animation-delay:7s;animation-timing-function:steps(15,end)"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; font-size: 18px; }
    .t { width: 0; animation-name: type; animation-fill-mode: forwards; }
    @keyframes type { to { width: var(--w); } }
    .cursor { opacity: 0; animation: blink 1s steps(1, end) 7.6s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .user  { fill: #E8C872; }
    .dim   { fill: #9C7A2E; }
    .key   { fill: #D4AF37; }
    .val   { fill: #F3E3B3; }
    .dollar{ fill: #B3374A; }
  </style>

  <!-- Ventana: fondo oscuro semitransparente + borde dorado -->
  <rect x="10" y="10" width="840" height="280" rx="12" fill="#0A0A0C" fill-opacity="0.6" stroke="url(#gold-edge)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Barra de título -->
  <line x1="11" y1="48" x2="849" y2="48" stroke="#D4AF37" stroke-opacity="0.2"/>
  <circle cx="34" cy="29" r="6" fill="#7A1F2E"/>
  <circle cx="56" cy="29" r="6" fill="#9C7A2E"/>
  <circle cx="78" cy="29" r="6" fill="#E8C872"/>
  <text x="430" y="35" text-anchor="middle" class="dim" style="font-size:14px">yona@fedora:~</text>

  <!-- Línea 1: comando -->
  <g clip-path="url(#c1)">
    <text x="36" y="92"><tspan class="user">yona@fedora</tspan><tspan class="dim">:~</tspan><tspan class="dollar">$ </tspan><tspan class="val">whoami</tspan></text>
  </g>

  <!-- Datos -->
  <g clip-path="url(#c2)">
    <text x="36" y="130"><tspan class="key">Subject </tspan><tspan class="dim">: </tspan><tspan class="val">Yonathan Sánchez</tspan></text>
  </g>
  <g clip-path="url(#c3)">
    <text x="36" y="162"><tspan class="key">Role    </tspan><tspan class="dim">: </tspan><tspan class="val">Full-Stack Developer Jr</tspan></text>
  </g>
  <g clip-path="url(#c4)">
    <text x="36" y="194"><tspan class="key">Stack   </tspan><tspan class="dim">: </tspan><tspan class="val">TypeScript · JavaScript · Node.js</tspan></text>
  </g>
  <g clip-path="url(#c5)">
    <text x="36" y="226"><tspan class="key">Focus   </tspan><tspan class="dim">: </tspan><tspan class="val">OOP · Event-Driven · Docker</tspan></text>
  </g>

  <!-- Prompt final con cursor parpadeante -->
  <g clip-path="url(#c6)">
    <text x="36" y="268"><tspan class="user">yona@fedora</tspan><tspan class="dim">:~</tspan><tspan class="dollar">$ </tspan></text>
  </g>
  <rect class="cursor" x="206" y="252" width="11" height="20" fill="#E8C872"/>
</svg>
